name: CI

on:
  push:
    branches: [main]
  pull_request:

# Check the latest state of each branch or pull request.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Every action and reusable workflow is pinned to a commit, with its
  # version beside it: a tag can be moved to other code, a commit cannot —
  # code that would then run with the release environment's signing identity
  # and the tokens that push to Cachix and the tap. `pinact run -u` updates
  # the pins.
  pinned:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The runner's Go fetches the toolchain pinact's module asks for.
      - name: Check that every action is pinned
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: go run github.com/suzuki-shunsuke/pinact/v5/cmd/pinact@v5.0.2 run --check

  ci:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # rustup, on every runner, installs the toolchain rust-toolchain.toml
      # pins as Cargo first runs; the window links the platform's own
      # libraries.
      - name: Install desktop libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # Linux PDF viewer integration tests render actual pages.
          sudo apt-get install -y pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev libsoup-3.0-dev libssl-dev libxdo-dev ghostscript
      # Writes the licences of the crates Tsumugi is built from, which macOS
      # checks.
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        if: runner.os == 'macOS'
        with:
          # The version THIRD-PARTY-LICENSES.txt was written with, so the
          # check compares like with like.
          tool: cargo-about@0.9.3
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # The same gate as local development.
      - run: cargo xtask ci
        env:
          CI: "1"
          # A runner has no firewall to ask, so the tests may listen on the
          # local network, which they skip by default.
          TSUMUGI_TEST_LAN: "1"

  # The scripts the tasks run go through Git Bash.
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo xtask ci
        env:
          CI: "1"
          # The debug information of a Windows build fills the runner's disk
          # before both lint and tests have built.
          CARGO_PROFILE_DEV_DEBUG: "0"

  # The Android app, whose Gradle and NDK the Rust gate does not need: its
  # Kotlin tests, and an APK built with the Rust core for every ABI it
  # carries.
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: platforms;android-37.2 build-tools;37.0.0 ndk;30.0.16248370
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: rustup target add aarch64-linux-android x86_64-linux-android
      - run: cargo install cargo-ndk@4.1.2 --locked
      - run: ./gradlew --no-daemon testDebugUnitTest assembleDebug
        working-directory: android

  # The disk image a release attaches, made the way the release makes it,
  # with a placeholder version, so a release is never its first run.
  bundle:
    uses: ./.github/workflows/bundle.yml
