name: Bundle

# Build Tsumugi.app for release and put it in the disk image a GitHub Release
# carries (`cargo xtask bundle`). ci.yml calls it with a placeholder version so the
# packaging is exercised before any release depends on it; release.yml calls
# it with the tag.

on:
  workflow_call:
    inputs:
      version:
        description: The version to stamp and to name the disk image by, without a leading v
        type: string
        default: 0.0.0-ci
      # Signs Tsumugi.app by the release identity, kept in the secrets of the
      # environment "release"; ad hoc otherwise. Every release is signed by
      # the same one, so an update keeps what users let the app do.
      sign:
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  linux:
    name: bundle (linux-x86_64)
    runs-on: ubuntu-24.04
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install desktop libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev libsoup-3.0-dev libssl-dev libxdo-dev
      - name: Stamp version and build
        run: |
          perl assets/release/stamp-version.pl "$VERSION"
          cargo build --release --locked -p tsumugi
          assets/linux/bundle.sh "$VERSION" dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bundle-linux-x86_64
          path: dist/*
          if-no-files-found: error
          retention-days: 3

  macos:
    name: bundle (macos-${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            arch: aarch64
          - os: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.os }}
    environment: ${{ inputs.sign && 'release' || '' }}
    timeout-minutes: 60
    env:
      VERSION: ${{ inputs.version }}
    # Release builds start without caches, so nothing a pull request wrote
    # can reach a published package.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Import the release signing identity
        if: inputs.sign
        run: |
          assets/macos/import-identity.sh "$RUNNER_TEMP/signing.keychain-db"
          echo "TSUMUGI_SIGN_IDENTITY=Tsumugi Release" >>"$GITHUB_ENV"
        env:
          MACOS_SIGNING_P12: ${{ secrets.MACOS_SIGNING_P12 }}
          MACOS_SIGNING_PASSWORD: ${{ secrets.MACOS_SIGNING_PASSWORD }}
      # The script `cargo xtask ci` also runs, so a placeholder it no longer finds
      # fails a pull request rather than a release.
      - name: Stamp the version
        run: perl assets/release/stamp-version.pl "$VERSION"
      - name: Bundle
        run: cargo xtask bundle "$VERSION"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bundle-macos-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error
          # A release attaches its disk image; a pull request's only needs to
          # stay while it is reviewed.
          retention-days: ${{ inputs.version == '0.0.0-ci' && 3 || 30 }}
