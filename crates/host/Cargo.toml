[package]
name = "tsumugi-host"
description = "The tsumugi work host: the work it owns, the sessions and shells it starts in the terminal host, delegation, and the CLI that asks it"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
tracing.workspace = true
tsumugi-sys.workspace = true
tsumugi-agents.workspace = true
tsumugi-net.workspace = true
tsumugi-core.workspace = true
tsumugi-model.workspace = true
tsumugi-nvim.workspace = true
tsumugi-protocol = { workspace = true, features = ["client"] }
tsumugi-term.workspace = true
tsumugi-vcs.workspace = true
base64.workspace = true
image.workspace = true
libc.workspace = true
regex.workspace = true
resvg.workspace = true
rusqlite.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
tempfile.workspace = true
sysinfo = { version = "0.39.6", default-features = false, features = ["system"] }
toml.workspace = true
thiserror.workspace = true
tokio.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation.workspace = true

[dev-dependencies]
tsumugi-model = { workspace = true, features = ["testing"] }
tsumugi-protocol = { workspace = true, features = ["testing"] }
tempfile.workspace = true
wuff = "0.2.9"
